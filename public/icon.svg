<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#f4efe6"/>
  <g transform="translate(256 256)" fill="none" stroke="#1a1a1a" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
    <!-- soft watercolor blob behind -->
  </g>
  <g>
    <ellipse cx="256" cy="292" rx="200" ry="24" fill="#c9b98e" opacity="0.55"/>
    <ellipse cx="256" cy="284" rx="180" ry="18" fill="#8db866" opacity="0.35"/>
  </g>
  <g fill="none" stroke="#1a1a1a" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">
    <!-- camera body -->
    <rect x="96" y="176" width="320" height="200" rx="14" fill="#f4efe6"/>
    <!-- top hump for viewfinder -->
    <path d="M188 176 L212 128 L300 128 L324 176"/>
    <!-- lens outer -->
    <circle cx="256" cy="276" r="72" fill="#f4efe6"/>
    <!-- lens middle -->
    <circle cx="256" cy="276" r="46" fill="none"/>
    <!-- lens inner reflection -->
    <circle cx="256" cy="276" r="20" fill="#1a1a1a"/>
    <circle cx="242" cy="262" r="6" fill="#f4efe6" stroke="none"/>
    <!-- shutter button -->
    <circle cx="360" cy="204" r="10" fill="#c85252" stroke="#1a1a1a" stroke-width="6"/>
    <!-- flash dot -->
    <circle cx="140" cy="212" r="6" fill="#1a1a1a"/>
  </g>
  <!-- sketchy underline -->
  <path d="M96 400 Q256 420 416 400" fill="none" stroke="#1a1a1a" stroke-width="4" opacity="0.5"/>
</svg>
