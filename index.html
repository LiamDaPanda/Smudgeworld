<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Smudgeworld</title>
    <style>
      :root {
        --safe-t: env(safe-area-inset-top, 0px);
        --safe-b: env(safe-area-inset-bottom, 0px);
        --safe-l: env(safe-area-inset-left, 0px);
        --safe-r: env(safe-area-inset-right, 0px);
      }
      html, body {
        margin: 0; padding: 0; height: 100%;
        background: #f4efe6; overflow: hidden;
        font-family: Georgia, serif;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none;
        overscroll-behavior: none;
      }
      #game { display: block; width: 100vw; height: 100vh; cursor: crosshair; touch-action: none; }
      #hud {
        position: fixed;
        top: calc(12px + var(--safe-t));
        left: calc(16px + var(--safe-l));
        right: calc(16px + var(--safe-r));
        display: flex; justify-content: space-between; align-items: flex-start;
        pointer-events: none; color: #2b2b2b; font-size: 14px; letter-spacing: 0.02em;
      }
      #hud .right { text-align: right; }
      #hud .hint { opacity: 0.55; font-style: italic; }
      #library {
        position: fixed;
        bottom: calc(12px + var(--safe-b));
        left: calc(16px + var(--safe-l));
        right: calc(16px + var(--safe-r));
        display: flex; gap: 10px; overflow-x: auto; pointer-events: none;
      }
      .snapshot {
        width: 96px; height: 72px; background: #fff;
        border: 1px solid #2b2b2b; padding: 4px 4px 18px;
        box-shadow: 2px 2px 0 #2b2b2b;
        font-size: 10px; color: #2b2b2b; text-align: center;
        flex: 0 0 auto; position: relative;
      }
      .snapshot .clarity { position: absolute; bottom: 3px; left: 0; right: 0; }

      /* Touch controls: hidden by default, shown on touch devices */
      #touch-controls { display: none; }
      body.touch #touch-controls { display: block; }
      body.touch #game { cursor: default; }
      body.touch #library { bottom: calc(120px + var(--safe-b)); }

      .tbtn {
        position: fixed;
        width: 64px; height: 64px; border-radius: 50%;
        background: rgba(255, 255, 255, 0.7);
        border: 1.5px solid #2b2b2b;
        color: #2b2b2b; font-size: 26px; font-family: Georgia, serif;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 2px 2px 0 rgba(43, 43, 43, 0.6);
        touch-action: none; user-select: none;
        -webkit-tap-highlight-color: transparent;
        transition: transform 60ms ease, background 60ms ease;
      }
      .tbtn.active { background: rgba(43, 43, 43, 0.85); color: #f4efe6; transform: scale(0.94); }

      #walk-left  { left: calc(20px + var(--safe-l));  bottom: calc(40px + var(--safe-b)); }
      #walk-right { left: calc(100px + var(--safe-l)); bottom: calc(40px + var(--safe-b)); }
      #cam-btn    { right: calc(20px + var(--safe-r)); bottom: calc(40px + var(--safe-b));
                    width: 76px; height: 76px; font-size: 30px; }
      #shutter-btn { right: calc(110px + var(--safe-r)); bottom: calc(50px + var(--safe-b));
                     width: 56px; height: 56px; font-size: 20px; display: none; }
      body.touch.cam-raised #shutter-btn { display: flex; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div>
        <div>Smudgeworld</div>
        <div class="hint" id="hint">A / D or ← → to walk · hold Shift to raise camera · click or Space to snap</div>
      </div>
      <div class="right">
        <div id="coin">Coins: 0</div>
        <div id="found">Snapshots: 0</div>
      </div>
    </div>
    <div id="library"></div>
    <div id="touch-controls">
      <div class="tbtn" id="walk-left">◀</div>
      <div class="tbtn" id="walk-right">▶</div>
      <div class="tbtn" id="cam-btn">📷</div>
      <div class="tbtn" id="shutter-btn">SNAP</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
