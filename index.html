<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Smudgeworld</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #f4efe6; overflow: hidden; font-family: Georgia, serif; }
      #game { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
      #hud {
        position: fixed; top: 12px; left: 16px; right: 16px;
        display: flex; justify-content: space-between; align-items: flex-start;
        pointer-events: none; color: #2b2b2b; font-size: 14px; letter-spacing: 0.02em;
      }
      #hud .right { text-align: right; }
      #hud .hint { opacity: 0.55; font-style: italic; }
      #library {
        position: fixed; bottom: 12px; left: 16px; right: 16px;
        display: flex; gap: 10px; overflow-x: auto; pointer-events: none;
      }
      .snapshot {
        width: 96px; height: 72px; background: #fff;
        border: 1px solid #2b2b2b; padding: 4px 4px 18px;
        box-shadow: 2px 2px 0 #2b2b2b;
        font-size: 10px; color: #2b2b2b; text-align: center;
        flex: 0 0 auto; position: relative;
      }
      .snapshot .clarity { position: absolute; bottom: 3px; left: 0; right: 0; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div>
        <div>Smudgeworld</div>
        <div class="hint">A / D or ← → to walk · hold Shift to raise camera · click or Space to snap</div>
      </div>
      <div class="right">
        <div id="coin">Coins: 0</div>
        <div id="found">Snapshots: 0</div>
      </div>
    </div>
    <div id="library"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
